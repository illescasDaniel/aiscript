[project]
name = "aiscript"
version = "1.5.0"
description = "JIT-compile plain-English intents into cached, reviewed shell or Python scripts via an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Illescas Romero", email = "illescas.daniel@protonmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx2>=2.14.0",
    "openai>=3.35.1",
    "pyyaml>=6.0.3",
    "typesafe-sdk>=0.7.5",
]

[project.optional-dependencies]
# Local QSIV safety reviewer: Linux x86_64 and an NVIDIA GPU only, so it is not a default dependency.
qsiv = ["qsiv-runtime>=0.1,<0.2"]

[project.scripts]
aiscript = "aiscript.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "taskipy>=1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Installed skills carry supporting code with their own style conventions.
extend-exclude = [".agents/skills", ".claude/skills", ".cursor/skills", ".codex/skills"]

# The shim runs on the system Python, which may be as old as 3.8.
per-file-target-version = { "src/aiscript/_shim/**" = "py38" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.flake8-annotations]
# Test doubles forward arbitrary arguments as `*args: Any, **kwargs: Any`.
allow-star-arg-any = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.taskipy.tasks]
dev = "python scripts/dev.py"
test = "pytest -q"
lint = "ruff check && ruff format --check && mypy src tests"
